# TKMiND Platform Configuration
# Change settings here without touching any code.

# ── Storage ──────────────────────────────────────────────────────────────────
db_path: data/tkmind.db        # SQLite structured-data file

# ── Reranker (visual Q&A pipeline, ported from PixelRAG) ─────────────────────
reranker: gpt-4o
top_k: 5
mmr_lambda: 0.4
rerank_top_n: 4

# ── Ingestion ─────────────────────────────────────────────────────────────────
pdf_dpi: 300
max_tile_px: 1344

# ── Embeddings (visual RAG index: design screens → FAISS) ────────────────────
# bedrock: Cohere Embed v4 on Amazon Bedrock (managed, pay per call, no GPU).
#          Needs AWS credentials: the instance role on AWS; locally
#          AWS_PROFILE=adlc in .env + `aws sso login --profile adlc`.
# http:    the self-hosted Qwen3-VL server at EMBED_API_URL (Colab/GPU).
# The two produce incompatible vectors — switching providers means
# rebuilding data/index.faiss (ingest_file refuses to mix them).
embed_provider: bedrock
bedrock_embed_model: eu.cohere.embed-v4:0
bedrock_region: eu-central-1
embed_dimension: 1536            # Cohere Embed v4 supports 256 / 512 / 1024 / 1536

# ── Answer synthesis (ported, kept for future Q&A reuse) ─────────────────────
answer_model: gpt-4o
crop_min_px: 900

# ── Requirements extraction (module 1) ───────────────────────────────────────
# Text extraction (PDF text layer / .docx), not vision — no image detail
# setting needed. On gpt-4o for now (same provider as design alignment below —
# switched from Claude Sonnet 5 temporarily; see ai/text/requirements_extractor.py's
# module docstring for what switching back involves).
extraction_model: gpt-4o
# gpt-4o's completion ceiling is 16384 — every story now carries scenarios +
# error handling even for capability-level docs (professional elaboration,
# not just literal transcription), which uses meaningfully more output than
# before. Leave headroom under the hard ceiling rather than sitting right at it.
extraction_max_tokens: 16000
# Epic size: an epic is a module/feature area, normally holding this many
# stories. Used in the extraction prompt, and by the consolidation check: when
# a fresh extraction has at least epic_consolidation_min_epics epics averaging
# fewer than epic_target_min_stories stories each (typical of a long RFP whose
# numbered sections were mirrored one-to-one), one extra call regroups them.
epic_target_min_stories: 3
epic_target_max_stories: 8
epic_consolidation_min_epics: 6

# ── Design alignment check (module 2) ────────────────────────────────────────
alignment_model: gpt-4o
alignment_image_detail: high
alignment_max_tokens: 1024
# All approved stories are passed inline in the alignment prompt (phase-1 scale:
# one PM, one designer, low volume — this is deliberately simple, not a stopgap).
# If an approved requirements doc ever exceeds this many stories, the alignment
# call raises instead of silently truncating — that's the signal to revisit this
# with real retrieval (search.py) rather than guessing at a cutoff now.
alignment_max_stories_inline: 60

# ── Requirements intake — image resources (module 1 extension) ──────────────
# A staged intake resource that's an image (a whiteboard photo, a screenshot)
# gets transcribed via GPT-4o vision into plain text at upload time, then
# merged into the same text-based extraction pipeline as every other
# resource — see ai/vision/transcribe.py.
intake_image_model: gpt-4o
intake_image_detail: high
intake_image_max_tokens: 2000

# ── UI/UX prompt generation (Figma Make prompts from approved stories) ──────
# One text call per prompt (structured tool output). Kept moderate on purpose:
# the goal is a dense, complete brief that doesn't burn the PM's Figma credits.
ux_prompt_model: gpt-4o
ux_prompt_max_tokens: 6000
# Soft ceiling shown to the PM as a length/credit indicator, in characters.
# Advisory only — nothing is truncated.
ux_prompt_soft_char_limit: 9000
# Optional screenshot of the existing screen for "edit existing" prompts,
# described once via GPT-4o vision and folded into that one generation.
ux_screenshot_model: gpt-4o
ux_screenshot_detail: high
ux_screenshot_max_tokens: 1500

# ── Reference-site style extraction (UI/UX prompts) ─────────────────────────
# The server fetches a PM-supplied public URL (read-only) and reads its HTML/CSS.
# Private, loopback and link-local addresses are always refused.
style_fetch_timeout_seconds: 8
style_fetch_max_bytes: 1500000       # per HTML or stylesheet response
style_fetch_max_stylesheets: 6
style_fetch_max_redirects: 4
style_fetch_user_agent: "TKMiND-StyleReader/1.0 (+design reference lookup)"

# ── Use-case diagrams (business requirements document) ──────────────────────
# One UML use-case diagram per story, generated automatically at export time
# and cached by story content. The model returns structured actors/use cases;
# our code writes the PlantUML text, which PlantUML renders locally to PNG
# (nothing is sent to an outside rendering service). If PlantUML/Java isn't
# installed, exports simply omit the diagrams.
use_case_model: gpt-4o
use_case_max_tokens: 1200
use_case_concurrency: 4            # parallel model calls while generating a document's diagrams
plantuml_jar: tools/plantuml.jar   # relative to the repo root; env PLANTUML_JAR overrides ("" disables)
java_command: java
plantuml_render_timeout_seconds: 120
plantuml_dpi: 150

# ── GPT-4o cost estimation (for ai_calls logging) ────────────────────────────
# USD per 1,000,000 tokens. Update when OpenAI changes pricing.
gpt4o_input_cost_per_million: 2.50
gpt4o_output_cost_per_million: 10.00

# ── Cohere Embed v4 on Bedrock cost estimation (for ai_calls logging) ────────
# USD per 1,000,000 input tokens (embeddings have no output tokens). From the
# AWS Price List API, 2026-09-28: "Cohere Embed 4 Model (Amazon Bedrock
# Edition)", eu-central-1, one input-token rate covering text and image
# tokens alike. Kept as two keys in case the rates ever diverge.
cohere_embed_text_cost_per_million: 0.12
cohere_embed_image_cost_per_million: 0.12

# ── Claude cost estimation (for ai_calls logging) ────────────────────────────
# USD per 1,000,000 tokens for claude-sonnet-5. PLACEHOLDER VALUES — I don't
# have a verified-current price for this exact model and didn't want to
# assert a number with false confidence; check Anthropic's pricing page and
# correct these before trusting the cost figures in ai_calls.
claude_input_cost_per_million: 3.00
claude_output_cost_per_million: 15.00
